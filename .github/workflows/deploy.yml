name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
   steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Run Tests
    run: echo "Running tests..."

  - name: Build Docker Image
    run: docker build -t devops-app .

  - name: Run Container
    run: docker run -d -p 5001:5001 devops-app
